# Checks the database rules against the Firebase emulator whenever they (or their tests) change.
# The rules are published by hand (see LEGGIMI.md), so this check does not block the site.
name: Controlla le regole del database
on:
  push:
    branches:
      - main
    paths:
      - database.rules.json
      - tests-rules/**
      - .github/workflows/rules-tests.yml
  workflow_dispatch:
jobs:
  rules:
    name: Regole del database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-save @firebase/rules-unit-testing@3 firebase@10
      - name: Prova le regole nell'emulatore
        run: |
          set +e
          npx -y firebase-tools@14 emulators:exec --only database --project demo-scarabokki \
            "node --test --test-reporter=spec tests-rules/" > out.txt 2>&1
          status=$?
          cat out.txt
          # failures also become annotations, readable on the run page without logging in
          if [ $status -ne 0 ]; then
            grep -E "✖|Error|expected|actual|denied|ECONNREFUSED|java" out.txt | head -40 | awk '{ printf "%s%%0A", $0 }' | sed 's/^/::error title=Regole del database::/'
            echo
          fi
          exit $status
