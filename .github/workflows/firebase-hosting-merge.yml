# Every time something lands on main: run the tests, and publish the site only if they pass.
name: Pubblica su Firebase
on:
  push:
    branches:
      - main
jobs:
  test:
    name: Controlla il gioco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - run: npm run lint
  deploy:
    name: Pubblica
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCARABOKKI_208A6 }}
          channelId: live
          projectId: scarabokki-208a6
